<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no,address=no,email=no" />
    <meta name="theme-color" content="#2b4acb" />
    <!--
      说明：Taro 的 H5 构建只在存在 src/index.html 时才注入 HtmlWebpackPlugin，
      缺失该文件会表现为「Compiled successfully 但 dist/h5 没有 index.html」。
    -->
    <title>女装B2B行业平台</title>
    <!--
      ⚠️ 根字号（rem 基准）必须自己设，否则整个 H5 会「缩小 2.4 倍」。

      原因：Taro 的 pxtransform 把设计稿 px 转成 rem（designWidth 750 时 1rem = 40px 设计稿）。
      小程序端由框架在运行时设置根字号，但 **H5 端的缩放脚本不会自动注入**，
      根字号会停在浏览器默认的 16px。结果：
        max-width: 750px  →  编译成 18.75rem  →  实际只有 300px
        font-size: 28px   →  编译成 0.7rem    →  实际只有 11.2px
      表现就是「内容挤在左边一条窄柱里、字特别小」。

      这里按 Taro 的换算关系设置根字号，并把宽度上限锁在 750px，
      使 PC 端呈现为居中的手机宽度（桌面浏览器的合理形态），移动端则按比例缩放。
    -->
    <script>
      (function () {
        var DESIGN_WIDTH = 750; // 与 config/index.ts 的 designWidth 保持一致
        var BASE = 40; // 1rem = 40px 设计稿
        var MAX_WIDTH = 750; // PC 端最大内容宽度
        function setRootFontSize() {
          var w = Math.min(document.documentElement.clientWidth || window.innerWidth || DESIGN_WIDTH, MAX_WIDTH);
          document.documentElement.style.fontSize = (w / DESIGN_WIDTH) * BASE + 'px';
        }
        setRootFontSize();
        window.addEventListener('resize', setRootFontSize);
        window.addEventListener('orientationchange', setRootFontSize);
      })();
    </script>
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f5f6f8;
      }
      /* 首屏骨架：避免 JS 加载期间白屏 */
      #wfb-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f5f6f8;
        color: #8b95a5;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        z-index: 9999;
        transition: opacity 0.2s;
      }
      #wfb-splash .logo {
        font-size: 20px;
        font-weight: 700;
        color: #2b4acb;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="wfb-splash">
      <div class="logo">女装B2B行业平台</div>
      <div>认知基础设施 · 连接引擎 · 效率工具</div>
      <div style="font-size: 12px; color: #b4bcc9">正在加载…</div>
    </div>
    <script>
      // Taro 挂载完成后移除首屏骨架
      (function () {
        var tries = 0;
        var timer = setInterval(function () {
          var app = document.getElementById('app');
          var splash = document.getElementById('wfb-splash');
          if (!splash) return clearInterval(timer);
          if ((app && app.children.length > 0) || ++tries > 100) {
            splash.style.opacity = '0';
            setTimeout(function () {
              splash.remove();
            }, 200);
            clearInterval(timer);
          }
        }, 50);
      })();
    </script>
  </body>
</html>
