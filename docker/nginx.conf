# ============================================================================
# 生产入口 Nginx：HTTPS + API 反向代理 + H5/PC Web 静态托管
# 使用前请把 server_name 改成你的已备案域名，并把证书放到 docker/certs/
# ============================================================================

upstream wfb_api {
    server api:3100;
    keepalive 32;
}

# HTTP → HTTPS 跳转（本地调试可直接用下面的 80 段）
server {
    listen 80;
    server_name your-domain.com;

    # 微信服务器校验 / 内容安全回调需要能直接访问
    location /api/ {
        proxy_pass http://wfb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 32m;
    }

    location /uploads/ {
        proxy_pass http://wfb_api;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        root /usr/share/nginx/html/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS（证书挂载到 docker/certs/fullchain.pem 与 privkey.pem）
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://wfb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket（站内信实时推送）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 32m;
    }

    location /uploads/ {
        proxy_pass http://wfb_api;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        root /usr/share/nginx/html/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
